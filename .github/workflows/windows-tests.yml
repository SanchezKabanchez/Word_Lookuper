name: Windows desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install desktop test dependencies from universal lock
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-ocr.txt -c requirements.lock
      - name: Check Windows Credential Manager backend imports
        run: python -c "from keyring.backends.Windows import WinVaultKeyring"
      - name: Install Tesseract for real OCR tests
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Exercise full suite including pause, recovery, overlays, hotkeys and OCR
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'word-lookup-tests'
          $results = Join-Path $env:RUNNER_TEMP 'word-lookup-artifacts'
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          python -m pytest -q --junitxml="$results/windows-results.xml"
          exit $LASTEXITCODE
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: ${{ runner.temp }}/word-lookup-artifacts/windows-results.xml
          if-no-files-found: error
  screenshots:
    name: Segoe UI at ${{ matrix.scale }}% controlled Tk scale
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        scale: [100, 125, 150]
    env:
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install locked Tk screenshot dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-ocr.txt -c requirements.lock
      - name: Render Segoe UI with controlled Tk scaling (desktop DPI unchanged)
        run: python scripts/render_screens.py --scale-percent ${{ matrix.scale }} --output-dir "${{ runner.temp }}/word-lookup-artifacts/windows-tk-${{ matrix.scale }}pct"
      - name: Retain Segoe UI screenshots and display metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-segoe-tk-${{ matrix.scale }}pct
          path: ${{ runner.temp }}/word-lookup-artifacts/windows-tk-${{ matrix.scale }}pct/
          if-no-files-found: error
