name: Static checks and dependency audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m ruff check .
      - run: python -m mypy
      - name: Audit pinned dependencies
        run: python -m pip_audit --disable-pip --no-deps -r requirements.lock --format json --output audit.json
      - name: Audit local-model runtime
        run: python -m pip_audit --disable-pip --no-deps -r requirements-offline.lock
      - name: Audit EXE runtime
        run: python -m pip_audit --disable-pip --no-deps -r requirements-build.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: audit.json
          if-no-files-found: warn
  macos-core:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - name: Check macOS secure backend imports
        run: python -c "from keyring.backends.macOS import Keyring"
      - name: Domain tests without hooks, Keychain prompts or Tk windows
        run: python -m pytest -q tests_core
