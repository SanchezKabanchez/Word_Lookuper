name: Build Windows EXE
on:
  push:
    branches: ['word-lookup-audit-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - run: python -m pip install -r requirements-build.lock
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = python -c "from word_lookup_version import __version__; print(__version__)"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and app version differ' }
      - name: Build and test the packaged OCR and Tk runtime
        run: python scripts/build_exe.py --smoke
      - name: Parse PresentMon helper using real PowerShell
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/measure_game_fps.ps1), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Out-String | Write-Error; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: WordLookup-Windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WordLookup-Windows-x64
          path: release-files
      - name: Publish the tagged release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
